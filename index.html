<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Titus Emanuel Ilieși — Photojournalist</title>

<meta name="description" content="Photojournalist. Documentar. Evenimente. Portofoliu profesional.">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:system-ui;
  background:#0a0a0a;
  color:#fff;
  scroll-behavior:smooth;
}

/* NAV */
nav{
  position:fixed;
  width:100%;
  padding:15px 30px;
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(10px);
  display:flex;
  justify-content:space-between;
  z-index:1000;
}

/* HERO */
.hero{
  height:100vh;
  position:relative;
  overflow:hidden;
}

.hero img{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0;
  transition:opacity 2s ease;
}

.hero img.active{opacity:1}

.hero-logo{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:280px;
  opacity:.08;
}

/* CATEGORIES */
.categories{
  display:flex;
  justify-content:center;
  gap:20px;
  padding:40px;
}

.categories button{
  background:#111;
  border:1px solid #333;
  color:#fff;
  padding:10px 20px;
  cursor:pointer;
}

.categories button.active{
  background:#fff;
  color:#000;
}

/* GALLERY */
#gallery{
  padding:20px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:20px;
}

.card img{
  width:100%;
  height:360px;
  object-fit:cover;
  cursor:pointer;
  transition:.4s;
}

.card img:hover{transform:scale(1.05)}

/* LIGHTBOX */
#lightbox{
  position:fixed;
  inset:0;
  background:#000;
  display:none;
  align-items:center;
  justify-content:center;
}

#lightbox img{
  max-width:90%;
  max-height:90%;
}

.lb-watermark{
  position:absolute;
  width:40%;
  opacity:.1;
}

/* FOOTER */
footer{text-align:center;padding:30px;color:#777}
</style>
</head>

<body>

<nav>
  <div>Titus Emanuel</div>
  <div>
    <a href="#gallery">Portofoliu</a>
  </div>
</nav>

<section class="hero" id="hero"></section>

<div class="categories">
  <button onclick="loadCategory('evenimente')" class="active">Evenimente</button>
  <button onclick="loadCategory('documentar')">Documentar</button>
  <button onclick="loadCategory('presa')">Presă</button>
</div>

<section id="gallery"></section>

<div id="lightbox">
  <img id="lb-img">
  <img src="logo.png" class="lb-watermark">
</div>

<footer>© 2026</footer>

<script>
let images=[];
let current=0;
let currentCategory="evenimente";

/* LOAD CATEGORY */
async function loadCategory(cat){
  currentCategory=cat;

  const res=await fetch(`https://api.github.com/repos/titusemanuel/titusemanuel.ro/contents/images/${cat}`);
  const data=await res.json();

  images=data.filter(f=>/\.(jpg|png|jpeg)$/i.test(f.name));
  renderGallery();

  document.querySelectorAll(".categories button").forEach(b=>b.classList.remove("active"));
  event.target.classList.add("active");
}

/* GALLERY */
function renderGallery(){
  const gallery=document.getElementById("gallery");
  gallery.innerHTML="";

  images.forEach((img,i)=>{
    const card=document.createElement("div");
    card.className="card";

    const image=document.createElement("img");
    image.src=img.download_url;
    image.loading="lazy";

    card.appendChild(image);
    gallery.appendChild(card);

    card.onclick=()=>openLightbox(i);
  });
}

/* LIGHTBOX */
function openLightbox(i){
  current=i;
  const lb=document.getElementById("lightbox");
  lb.style.display="flex";
  document.getElementById("lb-img").src=images[i].download_url;
}

/* NAVIGATION */
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight") next();
  if(e.key==="ArrowLeft") prev();
});

function next(){
  current=(current+1)%images.length;
  update();
}

function prev(){
  current=(current-1+images.length)%images.length;
  update();
}

function update(){
  document.getElementById("lb-img").src=images[current].download_url;
}

/* CLOSE */
document.getElementById("lightbox").onclick=e=>{
  if(e.target.id==="lightbox") e.currentTarget.style.display="none";
};

/* HERO */
async function loadHero(){
  const res=await fetch(`https://api.github.com/repos/titusemanuel/titusemanuel.ro/contents/images/evenimente`);
  const data=await res.json();

  const hero=document.getElementById("hero");

  data.slice(0,5).forEach((img,i)=>{
    const image=document.createElement("img");
    image.src=img.download_url;
    if(i===0) image.classList.add("active");
    hero.appendChild(image);
  });

  const logo=document.createElement("img");
  logo.src="logo.png";
  logo.className="hero-logo";
  hero.appendChild(logo);

  let i=0;
  setInterval(()=>{
    const imgs=hero.querySelectorAll("img:not(.hero-logo)");
    imgs[i].classList.remove("active");
    i=(i+1)%imgs.length;
    imgs[i].classList.add("active");
  },4000);
}

/* START */
loadHero();
loadCategory("evenimente");
</script>

</body>
</html>
