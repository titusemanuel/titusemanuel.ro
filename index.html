<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Titus Emanuel Ilieși — Photojournalist</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:system-ui;
  background:#0a0a0a;
  color:#fff;
}

/* NAV */
nav{
  position:fixed;
  width:100%;
  padding:15px 30px;
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(10px);
  display:flex;
  justify-content:space-between;
  z-index:1000;
}

/* HERO */
.hero{
  height:100vh;
  position:relative;
}

.hero img{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0;
  transition:opacity 1.5s;
}

.hero img.active{opacity:1}

.hero-logo{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:250px;
  opacity:.1;
}

/* GALLERY */
#gallery{
  padding:20px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:20px;
}

.card img{
  width:100%;
  height:340px;
  object-fit:cover;
  cursor:pointer;
}

/* LIGHTBOX */
#lightbox{
  position:fixed;
  inset:0;
  background:#000;
  display:none;
  align-items:center;
  justify-content:center;
}

#lightbox img{
  max-width:90%;
  max-height:90%;
}

.lb-watermark{
  position:absolute;
  width:40%;
  opacity:.1;
}

footer{
  text-align:center;
  padding:20px;
  color:#777;
}
</style>
</head>

<body>

<nav>
  <div>Titus Emanuel</div>
</nav>

<section class="hero" id="hero"></section>

<section id="gallery"></section>

<div id="lightbox">
  <img id="lb-img">
  <img src="logo.png" class="lb-watermark">
</div>

<footer>© 2026</footer>

<script>
let images=[];
let current=0;

/* LOAD IMAGES */
async function load(){
  const res=await fetch("https://api.github.com/repos/titusemanuel/titusemanuel.ro/contents/images");
  const data=await res.json();

  images=data.filter(f=>/\.(jpg|jpeg|png)$/i.test(f.name));

  createHero();
  createGallery();
}

/* HERO */
function createHero(){
  const hero=document.getElementById("hero");

  images.slice(0,5).forEach((img,i)=>{
    const image=document.createElement("img");
    image.src=img.download_url;
    if(i===0) image.classList.add("active");
    hero.appendChild(image);
  });

  const logo=document.createElement("img");
  logo.src="logo.png";
  logo.className="hero-logo";
  hero.appendChild(logo);

  let i=0;
  setInterval(()=>{
    const imgs=hero.querySelectorAll("img:not(.hero-logo)");
    imgs[i].classList.remove("active");
    i=(i+1)%imgs.length;
    imgs[i].classList.add("active");
  },4000);
}

/* GALLERY */
function createGallery(){
  const gallery=document.getElementById("gallery");

  images.forEach((img,i)=>{
    const card=document.createElement("div");
    card.className="card";

    const image=document.createElement("img");
    image.src=img.download_url;
    image.loading="lazy";

    card.appendChild(image);
    gallery.appendChild(card);

    card.onclick=()=>openLightbox(i);
  });
}

/* LIGHTBOX */
function openLightbox(i){
  current=i;
  document.getElementById("lightbox").style.display="flex";
  document.getElementById("lb-img").src=images[i].download_url;
}

document.getElementById("lightbox").onclick=e=>{
  if(e.target.id==="lightbox"){
    e.currentTarget.style.display="none";
  }
};

/* START */
load();
</script>

</body>
</html>
