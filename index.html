<script>
let images=[];

/* LOAD AUTOMAT DIN GITHUB */
async function loadImages(){
  const url="https://api.github.com/repos/titusemanuel/titusemanuel.ro/contents/images";

  const res=await fetch(url);
  const data=await res.json();

  images = data
    .filter(file => file.type==="file" && /\.(jpg|jpeg|png)$/i.test(file.name))
    .map(file => file.download_url);

  createHero();
  createGallery();
}

/* HERO */
function createHero(){
  const hero=document.getElementById("hero");

  images.slice(0,5).forEach((src,i)=>{
    const el=document.createElement("img");
    el.src=src;
    if(i===0) el.classList.add("active");
    hero.appendChild(el);
  });

  const logo=document.createElement("img");
  logo.src="logo.png";
  logo.className="hero-logo";
  hero.appendChild(logo);

  let i=0;
  setInterval(()=>{
    const imgs=hero.querySelectorAll("img:not(.hero-logo)");
    if(imgs.length===0) return;

    imgs[i].classList.remove("active");
    i=(i+1)%imgs.length;
    imgs[i].classList.add("active");
  },4000);
}

/* GALLERY */
function createGallery(){
  const gallery=document.getElementById("gallery");

  images.forEach((src,i)=>{
    const card=document.createElement("div");
    card.className="card reveal";

    const image=document.createElement("img");
    image.src=src;
    image.loading="lazy";
    image.decoding="async";
    image.draggable=false;

    card.appendChild(image);
    gallery.appendChild(card);

    card.onclick=()=>openLightbox(i);
  });
}

/* LIGHTBOX */
function openLightbox(i){
  document.getElementById("lightbox").style.display="flex";
  document.getElementById("lb-img").src=images[i];
}

/* CLOSE */
document.getElementById("lightbox").onclick=e=>{
  if(e.target.id==="lightbox"){
    e.currentTarget.style.display="none";
  }
};

/* SCROLL */
window.addEventListener("scroll",()=>{
  document.querySelectorAll(".reveal").forEach(el=>{
    const top=el.getBoundingClientRect().top;
    if(top<window.innerHeight-100){
      el.classList.add("active");
    }
  });
});

/* PROTECT */
document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("dragstart",e=>e.preventDefault());

/* START */
loadImages();
</script>
