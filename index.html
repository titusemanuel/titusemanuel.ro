<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Titus Emanuel Ilieși — Photojournalist</title>

<meta name="description" content="Portofoliu foto profesional. Photojournalist — Titus Emanuel Ilieși.">
<meta name="robots" content="index, follow">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
  background:#0a0a0a;
  color:#fff;
  scroll-behavior:smooth;
  user-select:none;
}

/* NAV */
nav{
  position:fixed;
  top:0;
  width:100%;
  padding:15px 30px;
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(10px);
  display:flex;
  justify-content:space-between;
  z-index:1000;
}

nav a{
  color:#fff;
  text-decoration:none;
  margin-left:20px;
  font-size:14px;
  opacity:.7;
}
nav a:hover{opacity:1}

/* HERO */
.hero{
  height:100vh;
  position:relative;
  overflow:hidden;
}

.hero img{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0;
  filter:blur(10px);
  transition:opacity 2s ease, filter 2s ease;
}

.hero img.active{
  opacity:1;
  filter:blur(0);
}

/* LOGO HERO */
.hero-logo{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:300px;
  opacity:0.1;
}

/* DESPRE */
#despre{
  padding:80px 20px;
  max-width:800px;
  margin:auto;
  text-align:center;
}

/* GALERIE */
#gallery{
  padding:40px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:20px;
}

.card img{
  width:100%;
  height:380px;
  object-fit:cover;
  transition:.5s;
  cursor:pointer;
}

.card img:hover{
  transform:scale(1.08);
}

/* LIGHTBOX */
#lightbox{
  position:fixed;
  inset:0;
  background:#000;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
  overflow:hidden;
}

#lightbox img{
  max-width:90%;
  max-height:90%;
  transition:transform .3s ease;
}

/* WATERMARK */
.lb-watermark{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:40%;
  opacity:0.1;
  pointer-events:none;
}

/* FOOTER */
footer{
  padding:30px;
  text-align:center;
  color:#777;
}
</style>
</head>

<body>

<nav>
  <div><strong>Titus Emanuel</strong></div>
  <div>
    <a href="#despre">Despre</a>
    <a href="#gallery">Portofoliu</a>
  </div>
</nav>

<section class="hero" id="hero"></section>

<section id="despre">
  <h2>Despre mine</h2>
  <p>Photojournalist documentar. Emoție reală. Cadre autentice.</p>
</section>

<section id="gallery"></section>

<div id="lightbox">
  <img id="lb-img">
  <img src="logo.png" class="lb-watermark">
</div>

<footer>
© 2026 Titus Emanuel Ilieși
</footer>

<script>
let images=[];
let current=0;
let zoom=1;
let startX=0;

/* LOAD */
async function load(){
  const res=await fetch("https://api.github.com/repos/titusemanuel/titusemanuel.ro/contents/images");
  const data=await res.json();
  images=data.filter(f=>/\.(jpg|png|jpeg)$/i.test(f.name));

  createHero();
  createGallery();
}

/* HERO */
function createHero(){
  const hero=document.getElementById("hero");

  images.slice(0,5).forEach((img,i)=>{
    const image=document.createElement("img");
    image.src=img.download_url;
    if(i===0) image.classList.add("active");
    hero.appendChild(image);
  });

  const logo=document.createElement("img");
  logo.src="logo.png";
  logo.className="hero-logo";
  hero.appendChild(logo);

  setInterval(()=>{
    const imgs=hero.querySelectorAll("img:not(.hero-logo)");
    imgs[current].classList.remove("active");
    current=(current+1)%imgs.length;
    imgs[current].classList.add("active");
  },4000);
}

/* GALERIE */
function createGallery(){
  const gallery=document.getElementById("gallery");

  images.forEach((img,i)=>{
    const card=document.createElement("div");

    const image=document.createElement("img");
    image.src=img.download_url;
    image.loading="lazy";

    card.appendChild(image);
    gallery.appendChild(card);

    card.onclick=()=>openLightbox(i);
  });
}

/* LIGHTBOX */
function openLightbox(i){
  current=i;
  const lb=document.getElementById("lightbox");
  lb.style.display="flex";
  document.getElementById("lb-img").src=images[i].download_url;
  zoom=1;
  updateZoom();
}

/* NAVIGATION */
function next(){
  current=(current+1)%images.length;
  updateImage();
}

function prev(){
  current=(current-1+images.length)%images.length;
  updateImage();
}

function updateImage(){
  const img=document.getElementById("lb-img");
  img.style.opacity=0;
  setTimeout(()=>{
    img.src=images[current].download_url;
    img.style.opacity=1;
  },200);
}

/* ZOOM */
function updateZoom(){
  document.getElementById("lb-img").style.transform=`scale(${zoom})`;
}

document.getElementById("lb-img").onclick=()=>{
  zoom = zoom===1 ? 2 : 1;
  updateZoom();
};

/* SWIPE */
document.getElementById("lightbox").addEventListener("touchstart",e=>{
  startX=e.touches[0].clientX;
});

document.getElementById("lightbox").addEventListener("touchend",e=>{
  let endX=e.changedTouches[0].clientX;
  if(endX - startX > 50) prev();
  if(startX - endX > 50) next();
});

/* CLOSE */
document.getElementById("lightbox").onclick=e=>{
  if(e.target.id==="lightbox"){
    e.currentTarget.style.display="none";
  }
};

/* PROTECT */
document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("dragstart",e=>e.preventDefault());
document.addEventListener("keydown",e=>{
  if(e.key==="F12") e.preventDefault();
});

load();
</script>

</body>
</html>
