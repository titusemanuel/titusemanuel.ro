<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portofoliu Foto — Titus Emanuel Ilieși</title>
  <meta name="description" content="Portofoliu foto al lui Titus Emanuel Ilieși — galerie de imagini încărcată automat din repository GitHub.">
  <meta name="keywords" content="portofoliu foto, fotografie, Titus Emanuel Ilieși, imagini, galerie foto, GitHub">
  <meta property="og:title" content="Portofoliu Foto — Titus Emanuel Ilieși">
  <meta property="og:description" content="Vezi portofoliul foto al lui Titus Emanuel Ilieși, galerie de imagini încărcată automat din repository GitHub.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://titusemanuel.github.io/titusemanuel.ro/">
  <meta property="og:image" content="https://titusemanuel.github.io/titusemanuel.ro/images/profil-titus%20(1).jpg">
  <meta name="author" content="Titus Emanuel Ilieși">

  <style>
    body {font-family: Arial, sans-serif; margin:0; padding:0; background:#f9f9f9;}
    header {background:#222; color:white; padding:20px; text-align:center; position: relative;}
    h1 {margin:0; font-size:24px;}
    .social-links {margin-top:10px;}
    .social-links a {
      display:inline-block;
      margin:0 8px;
      padding:6px 12px;
      border-radius:6px;
      background:#444;
      color:white;
      font-size:14px;
      text-decoration:none;
      transition:background 0.2s;
      cursor:pointer;
    }
    .social-links a:hover {background:#666;}

    /* Instalație Crăciun */
    .christmas-lights {
      position: absolute;
      top:0; left:0; right:0;
      height:20px;
      display:flex;
      justify-content: center;
      gap: 10px;
      padding-top: 5px;
      z-index: 1000;
    }
    .light {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: red;
      box-shadow: 0 0 10px rgba(255,0,0,0.7);
      animation: blink 1.5s infinite alternate;
    }
    .light:nth-child(2) {background: yellow; animation-delay: 0.2s; box-shadow: 0 0 10px rgba(255,255,0,0.7);}
    .light:nth-child(3) {background: green; animation-delay: 0.4s; box-shadow: 0 0 10px rgba(0,255,0,0.7);}
    .light:nth-child(4) {background: blue; animation-delay: 0.6s; box-shadow: 0 0 10px rgba(0,0,255,0.7);}
    .light:nth-child(5) {background: purple; animation-delay: 0.8s; box-shadow: 0 0 10px rgba(128,0,128,0.7);}

    @keyframes blink {
      0% {opacity: 0.2; transform: scale(0.7);}
      50% {opacity: 1; transform: scale(1.2);}
      100% {opacity: 0.2; transform: scale(0.7);}
    }

    #gallery {display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:15px; padding:20px;}
    .card {background:white; border-radius:8px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.1); cursor:pointer;}
    .card img {width:100%; display:block; height:200px; object-fit:cover; user-select:none; -webkit-user-drag: none;}
    .card .info {padding:10px; font-size:14px; color:#333;}
    .card .title {font-weight:bold; margin-bottom:4px;}
    #lightbox {
      position: fixed; top:0; left:0;
      width:100%; height:100%;
      background:rgba(0,0,0,0.9);
      display:none; justify-content:center; align-items:center;
      z-index:9999; flex-direction:column;
    }
    #lightbox img {
      max-width:90%; max-height:80%;
      border-radius:8px; box-shadow:0 4px 20px rgba(0,0,0,0.5);
      user-select:none; -webkit-user-drag: none;
    }
    #lightbox .controls {margin-top:10px; text-align:center;}
    .btn {color:white; font-size:30px; margin:0 15px; cursor:pointer; user-select:none;}
    footer {background:#222; color:white; text-align:center; padding:15px; font-size:14px;}
    footer .social-links {margin-top:10px;}
  </style>
</head>
<body>
  <header>
    <div class="christmas-lights">
      <div class="light"></div>
      <div class="light"></div>
      <div class="light"></div>
      <div class="light"></div>
      <div class="light"></div>
    </div>
    <h1>Portofoliu Foto — Titus Emanuel Ilieși</h1>
    <div class="social-links">
      <a href="#" onclick="openLink('https://www.instagram.com/titusemanuell')">Instagram</a>
      <a href="#" onclick="openLink('https://www.facebook.com/titusemanueliliesi')">Facebook</a>
      <a href="#" onclick="openLink('mailto:titusemanueliliesi28@gmail.com')">Email</a>
      <a href="#" onclick="openLink('https://www.mediafaxfoto.ro/Photos.aspx?fm=lSearch&q=EMANUEL%20TITUS%20ILIESI&pt=0&s=5,130,51,301,128,6,122,201')">Mediafax Foto</a>
    </div>
  </header>

  <main>
    <section id="gallery">
      <p>Se încarcă imaginile…</p>
    </section>
  </main>

  <div id="lightbox">
    <img src="" alt="">
    <div class="controls">
      <span class="btn" id="prev">&#10094;</span>
      <span class="btn" id="next">&#10095;</span>
    </div>
  </div>

  <footer>
    &copy; 2025 Titus Emanuel Ilieși. Toate drepturile rezervate.
    <div class="social-links">
      <a href="#" onclick="openLink('https://www.instagram.com/titusemanuell')">Instagram</a>
      <a href="#" onclick="openLink('https://www.mediafaxfoto.ro/Photos.aspx?fm=lSearch&q=EMANUEL%20TITUS%20ILIESI&pt=0&s=5,130,51,301,128,6,122,201')">Mediafax Foto</a>
      <a href="#" onclick="openLink('https://www.facebook.com/titusemanueliliesi')">Facebook</a>
      <a href="#" onclick="openLink('mailto:titusemanueliliesi28@gmail.com')">Email</a>
    </div>
  </footer>

  <script>
    let images = [];
    let currentIndex = 0;

    async function loadImages() {
      try {
        const res = await fetch("https://api.github.com/repos/titusemanuel/titusemanuel.ro/contents/images");
        if (!res.ok) throw new Error("Nu s-a putut încărca lista de imagini");
        const files = await res.json();

        const gallery = document.getElementById("gallery");
        gallery.innerHTML = "";

        images = files.filter(f => f.name.match(/\.(jpg|jpeg|png|gif)$/i));

        images.forEach((f, index) => {
          const card = document.createElement("div");
          card.className = "card";

          const image = document.createElement("img");
          image.src = f.download_url;
          image.alt = f.name.replace(/\.[^/.]+$/, "").replace(/[-_()]/g, " ");

          const info = document.createElement("div");
          info.className = "info";

          const title = document.createElement("div");
          title.className = "title";
          title.textContent = image.alt;

          info.appendChild(title);
          card.appendChild(image);
          card.appendChild(info);
          gallery.appendChild(card);

          card.addEventListener("click", () => openLightbox(index));
        });

        document.getElementById("prev").addEventListener("click", showPrev);
        document.getElementById("next").addEventListener("click", showNext);

        const lb = document.getElementById("lightbox");
        lb.addEventListener("click", e => {
          if (e.target.id === "lightbox") closeLightbox();
        });

        document.addEventListener("keydown", e => {
          if (e.key === "Escape") closeLightbox();
          if (e.key === "ArrowRight") showNext();
          if (e.key === "ArrowLeft") showPrev();
        });

      } catch (err) {
        document.getElementById("gallery").textContent = "Eroare: " + err.message;
        console.error(err);
      }
    }

    function openLightbox(index) {
      currentIndex = index;
      const lb = document.getElementById("lightbox");
      const lbImg = lb.querySelector("img");
      lbImg.src = images[index].download_url;
      lbImg.alt = images[index].name.replace(/\.[^/.]+$/, "").replace(/[-_()]/g, " ");
      lb.style.display = "flex";
    }

    function closeLightbox() {
      document.getElementById("lightbox").style.display = "none";
    }

    function showNext() {
      currentIndex = (currentIndex + 1) % images.length;
      openLightbox(currentIndex);
    }

    function showPrev() {
      currentIndex = (currentIndex - 1 + images.length) % images.length;
      openLightbox(currentIndex);
    }

    function openLink(url) {
      window.open(url, '_blank');
    }

    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
      alert("protecție");
    });

    document.addEventListener('dragstart', function(e) {
      if (e.target.tagName === 'IMG') e.preventDefault();
    });

    loadImages();
  </script>
</body>
</html>
