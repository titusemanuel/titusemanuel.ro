<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Titus Emanuel Ilieși — Photojournalist</title>

<meta name="description" content="Portofoliu foto profesional. Fotojurnalism, evenimente și reportaj.">
<meta name="keywords" content="fotograf, fotojurnalist, portofoliu foto, fotografie profesionala">
<meta name="robots" content="index, follow">

<!-- Open Graph (Facebook / Google) -->
<meta property="og:title" content="Titus Emanuel Ilieși — Photojournalist">
<meta property="og:description" content="Portofoliu foto profesional">
<meta property="og:type" content="website">

<style>
html{scroll-behavior:smooth}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:system-ui;
  background:#0a0a0a;
  color:#fff;
  overflow-x:hidden;
}

/* NAV */
nav{
  position:fixed;
  width:100%;
  padding:15px 30px;
  background:rgba(0,0,0,.85);
  backdrop-filter:blur(10px);
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:1000;
}

.nav-logo{
  height:50px;
  filter:invert(1);
  transition:transform .3s;
}
.nav-logo:hover{transform:scale(1.1)}

.nav-links{
  display:flex;
  gap:20px;
  list-style:none;
}
.nav-links a{
  color:#fff;
  text-decoration:none;
  font-size:14px;
  letter-spacing:1px;
  position:relative;
}
.nav-links a::after{
  content:"";
  position:absolute;
  bottom:-5px;
  left:0;
  width:0;
  height:1px;
  background:#fff;
  transition:.3s;
}
.nav-links a:hover::after{width:100%}

/* HERO */
.hero{
  height:100vh;
  position:relative;
  overflow:hidden;
}

.hero img.bg{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0;
  transform:scale(1.1);
  transition:opacity 2s, transform 6s;
}

.hero img.active{
  opacity:1;
  transform:scale(1);
}

.hero-logo{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:300px;
  opacity:0.9;
  z-index:10;
  pointer-events:none;
  filter:invert(1);
  animation:fadeIn 2s ease;
}

@keyframes fadeIn{
  from{opacity:0;transform:translate(-50%,-60%)}
  to{opacity:0.9;transform:translate(-50%,-50%)}
}

/* GALLERY */
#gallery{
  padding:100px 20px 20px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:20px;
}

.card{
  position:relative;
  overflow:hidden;
}

.card img{
  width:100%;
  height:340px;
  object-fit:cover;
  cursor:pointer;
  transition:transform .5s;
  user-select:none;
  -webkit-user-drag:none;
}

.card:hover img{
  transform:scale(1.05);
}

/* watermark */
.card::after{
  content:"";
  position:absolute;
  inset:0;
  background:url('logo.png') center/40% no-repeat;
  opacity:0.15;
  pointer-events:none;
}

/* LIGHTBOX */
#lightbox{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.95);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:2000;
}

#lightbox img{
  max-width:90%;
  max-height:90%;
}

.lb-watermark{
  position:absolute;
  width:40%;
  opacity:0.3;
  pointer-events:none;
}

/* FOOTER */
footer{
  text-align:center;
  padding:20px;
  color:#777;
}
</style>
</head>

<body>

<nav>
  <a href="#hero"><img src="logo.png" class="nav-logo"></a>
  <ul class="nav-links">
    <li><a href="#gallery">Galerie</a></li>
  </ul>
</nav>

<section class="hero" id="hero"></section>

<section id="gallery"></section>

<div id="lightbox">
  <img id="lb-img">
  <img src="logo.png" class="lb-watermark">
</div>

<footer>© 2026 Titus Emanuel</footer>

<script>
let images=[];
let current=0;

/* LOAD */
async function load(){
  const res=await fetch("https://api.github.com/repos/titusemanuel/titusemanuel.ro/contents/images");
  const data=await res.json();

  images=data.filter(f=>/\.(jpg|jpeg|png)$/i.test(f.name));

  createHero();
  createGallery();
}

/* HERO */
function createHero(){
  const hero=document.getElementById("hero");

  images.slice(0,5).forEach((img,i)=>{
    const el=document.createElement("img");
    el.src=img.download_url;
    el.classList.add("bg");
    if(i===0) el.classList.add("active");
    hero.appendChild(el);
  });

  const logo=document.createElement("img");
  logo.src="logo.png";
  logo.className="hero-logo";
  hero.appendChild(logo);

  let i=0;
  setInterval(()=>{
    const imgs=document.querySelectorAll(".bg");
    imgs[i].classList.remove("active");
    i=(i+1)%imgs.length;
    imgs[i].classList.add("active");
  },4000);
}

/* GALLERY */
function createGallery(){
  const gallery=document.getElementById("gallery");

  images.forEach((img,i)=>{
    const card=document.createElement("div");
    card.className="card";

    const image=document.createElement("img");
    image.src=img.download_url;
    image.loading="lazy";
    image.decoding="async";
    image.draggable=false;

    card.appendChild(image);
    gallery.appendChild(card);

    card.onclick=()=>openLightbox(i);
  });
}

/* LIGHTBOX */
function openLightbox(i){
  current=i;
  document.getElementById("lightbox").style.display="flex";
  document.getElementById("lb-img").src=images[i].download_url;
}

document.getElementById("lightbox").onclick=e=>{
  if(e.target.id==="lightbox"){
    e.currentTarget.style.display="none";
  }
};

/* 🔒 PROTECTIE */
document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("dragstart",e=>e.preventDefault());
document.addEventListener("selectstart",e=>e.preventDefault());
document.addEventListener("keydown",e=>{
  if(e.key==="PrintScreen"){
    navigator.clipboard.writeText("");
  }
});

/* START */
load();
</script>

</body>
</html>
