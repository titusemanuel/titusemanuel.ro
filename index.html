<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Titus Emanuel Ilieși — Photojournalist</title>

<meta name="description" content="Portofoliu foto premium. Fotojurnalism și fotografie profesională.">
<meta name="robots" content="index, follow">

<style>
html{scroll-behavior:smooth}
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:system-ui;
  background:#0a0a0a;
  color:#fff;
  overflow-x:hidden;
}

/* LOADER */
#loader{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

/* NAV */
nav{
  position:fixed;
  width:100%;
  padding:15px 30px;
  background:rgba(0,0,0,.85);
  backdrop-filter:blur(10px);
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:1000;
}

.nav-logo{
  height:50px;
  filter:invert(1);
}

/* HERO */
.hero{
  height:100vh;
  position:relative;
  overflow:hidden;
}

.hero img{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0;
  transform:scale(1.2);
  transition:2s;
}

.hero img.active{
  opacity:1;
  transform:scale(1);
}

.hero-logo{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:300px;
  opacity:.9;
  z-index:10;
  filter:invert(1);
}

/* SCROLL ANIMATION */
.reveal{
  opacity:0;
  transform:translateY(60px);
  transition:1s;
}
.reveal.active{
  opacity:1;
  transform:translateY(0);
}

/* GALLERY */
#gallery{
  padding:100px 20px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:20px;
}

.card{
  position:relative;
  overflow:hidden;
}

.card img{
  width:100%;
  height:340px;
  object-fit:cover;
  transition:.6s;
}

.card:hover img{
  transform:scale(1.1);
}

/* watermark */
.card::after{
  content:"";
  position:absolute;
  inset:0;
  background:url('logo.png') center/40% no-repeat;
  opacity:.1;
}

/* LIGHTBOX */
#lightbox{
  position:fixed;
  inset:0;
  background:#000;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:2000;
}

#lightbox img{
  max-width:90%;
  max-height:90%;
}

.lb-watermark{
  position:absolute;
  width:40%;
  opacity:.3;
}

/* FOOTER */
footer{
  text-align:center;
  padding:30px;
  color:#777;
}
</style>
</head>

<body>

<div id="loader">LOADING...</div>

<nav>
  <img src="logo.png" class="nav-logo">
</nav>

<section class="hero" id="hero"></section>

<section id="gallery"></section>

<div id="lightbox">
  <img id="lb-img">
  <img src="logo.png" class="lb-watermark">
</div>

<footer>© 2026 Titus Emanuel</footer>

<script>
let images=[];

/* LOAD AUTOMAT DIN GITHUB */
async function loadImages(){
  try{
    const url="https://api.github.com/repos/titusemanuel/titusemanuel.ro/contents/images";
    const res=await fetch(url);
    const data=await res.json();

    images = data
      .filter(file => file.type==="file" && /\.(jpg|jpeg|png)$/i.test(file.name))
      .map(file => file.download_url);

    createHero();
    createGallery();

    document.getElementById("loader").style.display="none";
  }catch(e){
    console.error("Eroare:",e);
  }
}

/* HERO */
function createHero(){
  const hero=document.getElementById("hero");

  images.slice(0,5).forEach((src,i)=>{
    const el=document.createElement("img");
    el.src=src;
    if(i===0) el.classList.add("active");
    hero.appendChild(el);
  });

  const logo=document.createElement("img");
  logo.src="logo.png";
  logo.className="hero-logo";
  hero.appendChild(logo);

  let i=0;
  setInterval(()=>{
    const imgs=hero.querySelectorAll("img:not(.hero-logo)");
    if(imgs.length===0) return;

    imgs[i].classList.remove("active");
    i=(i+1)%imgs.length;
    imgs[i].classList.add("active");
  },4000);
}

/* GALLERY */
function createGallery(){
  const gallery=document.getElementById("gallery");

  images.forEach((src,i)=>{
    const card=document.createElement("div");
    card.className="card reveal";

    const image=document.createElement("img");
    image.src=src;
    image.loading="lazy";
    image.decoding="async";
    image.draggable=false;

    card.appendChild(image);
    gallery.appendChild(card);

    card.onclick=()=>openLightbox(i);
  });
}

/* LIGHTBOX */
function openLightbox(i){
  document.getElementById("lightbox").style.display="flex";
  document.getElementById("lb-img").src=images[i];
}

/* CLOSE */
document.getElementById("lightbox").onclick=e=>{
  if(e.target.id==="lightbox"){
    e.currentTarget.style.display="none";
  }
};

/* SCROLL */
window.addEventListener("scroll",()=>{
  document.querySelectorAll(".reveal").forEach(el=>{
    const top=el.getBoundingClientRect().top;
    if(top<window.innerHeight-100){
      el.classList.add("active");
    }
  });
});

/* PROTECT */
document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("dragstart",e=>e.preventDefault());

/* START */
loadImages();
</script>

</body>
</html>
