<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Titus Emanuel Ilieși | Photojournalist Portfolio 2026</title>

<meta name="description" content="Portofoliu foto premium 2026. Fotojurnalism cinematic.">
<meta name="robots" content="index, follow">
<meta id="keywords" name="keywords" content="foto, portofoliu">

<link rel="preconnect" href="https://api.github.com">

<style>
:root{--bg:#050505;}
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:system-ui;
  background:var(--bg);
  color:#fff;
}

/* NAV */
nav{
  position:fixed;
  width:100%;
  padding:20px 40px;
  backdrop-filter:blur(20px);
  background:rgba(0,0,0,.4);
  z-index:1000;
}
.logo{height:50px;filter:invert(1);}

/* HERO */
.hero{
  height:100vh;
  position:relative;
  overflow:hidden;
}

.hero img{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0;
  transition:1s;
}

.hero img.active{opacity:1;}

.hero h1{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:clamp(40px,6vw,90px);
  z-index:10;
}

/* ARROWS HERO */
.arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  font-size:40px;
  cursor:pointer;
  z-index:20;
  padding:10px;
  background:rgba(0,0,0,.4);
  border-radius:50%;
}
.left{left:20px;}
.right{right:20px;}

/* GALLERY */
.gallery{
  padding:120px 40px;
  column-count:4;
  column-gap:20px;
}
@media(max-width:1200px){.gallery{column-count:3}}
@media(max-width:800px){.gallery{column-count:2}}
@media(max-width:500px){.gallery{column-count:1}}

.item{
  margin-bottom:20px;
  break-inside:avoid;
  border-radius:16px;
  overflow:hidden;
  cursor:pointer;
}

.item img{
  width:100%;
  transition:.5s;
}
.item:hover img{transform:scale(1.08);}

/* LIGHTBOX */
#lightbox{
  position:fixed;
  inset:0;
  background:#000;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:2000;
}

#lb-img{
  max-width:90%;
  max-height:90%;
}

.lb-arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  font-size:50px;
  cursor:pointer;
  padding:20px;
  color:#fff;
}

.lb-left{left:20px;}
.lb-right{right:20px;}

/* WATERMARK LIGHTBOX */
#lb-watermark{
  position:absolute;
  bottom:20px;
  right:20px;
  color:#fff;
  font-size:16px;
  opacity:0.7;
  z-index:2010;
  font-family:system-ui;
}

/* FOOTER */
footer{
  text-align:center;
  padding:40px;
  color:#777;
}

/* CLICK PROTECT */
#copyright{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#000;
  padding:10px 20px;
  border-radius:10px;
  display:none;
}
</style>
</head>

<body>

<nav>
  <img src="logo.png" class="logo">
</nav>

<section class="hero" id="hero">
  <h1>TITUS EMANUEL</h1>
  <div class="arrow left" onclick="prevHero()">‹</div>
  <div class="arrow right" onclick="nextHero()">›</div>
</section>

<section class="gallery" id="gallery"></section>

<!-- LIGHTBOX -->
<div id="lightbox">
  <div class="lb-arrow lb-left" onclick="prevImg()">‹</div>
  <img id="lb-img">
  <div class="lb-arrow lb-right" onclick="nextImg()">›</div>
  <div id="lb-watermark">© Titus Emanuel</div>
</div>

<div id="copyright">© Drept de autor protejat</div>

<footer>© 2026 Titus Emanuel</footer>

<script>
let images=[];
let heroIndex=0;
let currentIndex=0;

/* LOAD IMAGES */
async function loadImages(){
  const url="https://api.github.com/repos/titusemanuel/titusemanuel.ro/contents/images";
  const res=await fetch(url);
  const data=await res.json();

  images = data
    .filter(f => /\.(jpg|jpeg|png)$/i.test(f.name))
    .map(f => f.download_url);

  createHero();
  createGallery();
}

/* HERO */
function createHero(){
  const hero=document.getElementById("hero");

  images.slice(0,6).forEach((src,i)=>{
    const img=document.createElement("img");
    img.src=src;
    if(i===0) img.classList.add("active");
    hero.appendChild(img);
  });
}

function showHero(i){
  const imgs=document.querySelectorAll(".hero img");
  imgs.forEach(el=>el.classList.remove("active"));
  imgs[i].classList.add("active");
}

function nextHero(){
  heroIndex=(heroIndex+1)%6;
  showHero(heroIndex);
}

function prevHero(){
  heroIndex=(heroIndex-1+6)%6;
  showHero(heroIndex);
}

/* AUTO HERO */
setInterval(nextHero,4000);

/* GALLERY */
function createGallery(){
  const gallery=document.getElementById("gallery");

  images.forEach((src,i)=>{
    const div=document.createElement("div");
    div.className="item";

    const img=document.createElement("img");
    img.src=src;
    img.loading="lazy";

    div.appendChild(img);
    gallery.appendChild(div);

    div.onclick=()=>openLightbox(i);
  });
}

/* LIGHTBOX */
function openLightbox(i){
  currentIndex=i;
  document.getElementById("lightbox").style.display="flex";
  document.getElementById("lb-img").src=images[i];
  document.getElementById("lb-watermark").textContent = "© Titus Emanuel";
}

function nextImg(){
  currentIndex=(currentIndex+1)%images.length;
  document.getElementById("lb-img").src=images[currentIndex];
}

function prevImg(){
  currentIndex=(currentIndex-1+images.length)%images.length;
  document.getElementById("lb-img").src=images[currentIndex];
}

/* CLOSE LIGHTBOX */
document.getElementById("lightbox").onclick=e=>{
  if(e.target.id==="lightbox"){
    e.currentTarget.style.display="none";
  }
};

/* KEYBOARD */
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight") nextImg();
  if(e.key==="ArrowLeft") prevImg();
});

/* PROTECT */
document.addEventListener("contextmenu",e=>{
  e.preventDefault();
  const box=document.getElementById("copyright");
  box.style.display="block";
  setTimeout(()=>box.style.display="none",2000);
});

document.addEventListener("dragstart",e=>e.preventDefault());

/* START */
loadImages();
</script>

</body>
</html>
