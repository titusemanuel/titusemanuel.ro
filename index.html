<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Titus Emanuel Ilieși | Portofoliu Foto 2026</title>
<style>
body{margin:0;font-family:system-ui;background:#050505;color:#fff;}
nav{position:fixed;top:0;width:100%;padding:20px;background:rgba(0,0,0,.4);backdrop-filter:blur(20px);z-index:1000;text-align:center;font-size:20px;}
.hero{height:100vh;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.hero img{position:absolute;width:100%;height:100%;object-fit:cover;opacity:0;transition:1s;}
.hero img.active{opacity:1;}
.hero h1{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:clamp(40px,6vw,90px);z-index:10;text-shadow:2px 2px 10px #000;}
.arrow{position:absolute;top:50%;transform:translateY(-50%);font-size:40px;cursor:pointer;z-index:20;padding:10px;background:rgba(0,0,0,.4);border-radius:50%;}
.left{left:20px;} .right{right:20px;}
.gallery{padding:120px 40px;column-count:4;column-gap:20px;}
@media(max-width:1200px){.gallery{column-count:3}}
@media(max-width:800px){.gallery{column-count:2}}
@media(max-width:500px){.gallery{column-count:1}}
.item{margin-bottom:20px;break-inside:avoid;border-radius:16px;overflow:hidden;cursor:pointer;background:#0a0a0a;}
.item img{width:100%;transition:.5s;}
.item:hover img{transform:scale(1.08);}
.caption{padding:10px;font-size:14px;color:#aaa;text-align:center;letter-spacing:0.5px;}
#lightbox{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;z-index:2000;}
#lb-img{max-width:90%;max-height:90%;}
.lb-arrow{position:absolute;top:50%;transform:translateY(-50%);font-size:50px;cursor:pointer;padding:20px;color:#fff;}
.lb-left{left:20px;} .lb-right{right:20px;}
#lb-watermark{position:absolute;bottom:20px;right:20px;color:#fff;font-size:16px;opacity:0.7;z-index:2010;}
footer{text-align:center;padding:40px;color:#777;}
#copyright{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#000;padding:10px 20px;border-radius:10px;display:none;}
</style>
</head>
<body>

<nav>PORTOFOLIU FOTO 2026</nav>

<section class="hero" id="hero">
  <h1>TITUS EMANUEL</h1>
  <div class="arrow left" onclick="prevHero()">‹</div>
  <div class="arrow right" onclick="nextHero()">›</div>
</section>

<section class="gallery" id="gallery"></section>

<div id="lightbox">
  <div class="lb-arrow lb-left" onclick="prevImg()">‹</div>
  <img id="lb-img">
  <div class="lb-arrow lb-right" onclick="nextImg()">›</div>
  <div id="lb-watermark"></div>
</div>

<div id="copyright">© Drept de autor protejat</div>

<footer>© 2026 Titus Emanuel</footer>

<script>
// IMAGINI EXEMPLE
const images=[
  "https://picsum.photos/id/1011/800/600",
  "https://picsum.photos/id/1012/800/600",
  "https://picsum.photos/id/1013/800/600",
  "https://picsum.photos/id/1014/800/600",
  "https://picsum.photos/id/1015/800/600",
  "https://picsum.photos/id/1016/800/600"
];
const imageNames=[
  "Foto 1",
  "Foto 2",
  "Foto 3",
  "Foto 4",
  "Foto 5",
  "Foto 6"
];

let heroIndex=0;
let currentIndex=0;

// HERO
function createHero(){
  const hero=document.getElementById("hero");
  images.slice(0,6).forEach((src,i)=>{
    const img=document.createElement("img");
    img.src=src;
    if(i===0) img.classList.add("active");
    hero.appendChild(img);
  });
}
function showHero(i){
  const imgs=document.querySelectorAll(".hero img");
  imgs.forEach(el=>el.classList.remove("active"));
  imgs[i].classList.add("active");
}
function nextHero(){heroIndex=(heroIndex+1)%6; showHero(heroIndex);}
function prevHero(){heroIndex=(heroIndex-1+6)%6; showHero(heroIndex);}
setInterval(nextHero,4000);

// GALERIE
function createGallery(){
  const gallery=document.getElementById("gallery");
  images.forEach((src,i)=>{
    const div=document.createElement("div");
    div.className="item";
    const img=document.createElement("img");
    img.src=src;
    img.loading="lazy";
    const caption=document.createElement("div");
    caption.className="caption";
    caption.textContent=imageNames[i];
    div.appendChild(img);
    div.appendChild(caption);
    div.onclick=()=>openLightbox(i);
    gallery.appendChild(div);
  });
}

// LIGHTBOX
function openLightbox(i){
  currentIndex=i;
  document.getElementById("lightbox").style.display="flex";
  document.getElementById("lb-img").src=images[i];
  document.getElementById("lb-watermark").textContent=imageNames[i];
}
function nextImg(){
  currentIndex=(currentIndex+1)%images.length;
  document.getElementById("lb-img").src=images[currentIndex];
  document.getElementById("lb-watermark").textContent=imageNames[currentIndex];
}
function prevImg(){
  currentIndex=(currentIndex-1+images.length)%images.length;
  document.getElementById("lb-img").src=images[currentIndex];
  document.getElementById("lb-watermark").textContent=imageNames[currentIndex];
}

document.getElementById("lightbox").onclick=e=>{
  if(e.target.id==="lightbox") e.currentTarget.style.display="none";
};

document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight") nextImg();
  if(e.key==="ArrowLeft") prevImg();
});

document.addEventListener("contextmenu",e=>{
  e.preventDefault();
  const box=document.getElementById("copyright");
  box.style.display="block";
  setTimeout(()=>box.style.display="none",2000);
});

document.addEventListener("dragstart",e=>e.preventDefault());

createHero();
createGallery();
</script>

</body>
</html>
