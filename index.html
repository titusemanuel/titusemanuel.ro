<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Titus Emanuel Ilieși — Photojournalist</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
  background:#0b0b0b;
  color:#fff;
  scroll-behavior:smooth;
}

/* NAV */
nav{
  position:fixed;
  top:0;
  width:100%;
  padding:15px 30px;
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(10px);
  display:flex;
  justify-content:space-between;
  z-index:1000;
}

nav a{
  color:#fff;
  text-decoration:none;
  margin-left:20px;
  font-size:14px;
  opacity:.7;
}
nav a:hover{opacity:1}

/* HERO */
.hero{
  height:100vh;
  position:relative;
  overflow:hidden;
}

.hero img{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0;
  transition:opacity 2s ease;
}

.hero img.active{
  opacity:1;
}

/* LOGO HERO */
.hero-logo{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:300px;
  opacity:0.15;
}

/* TEXT HERO */
.hero-text{
  position:absolute;
  bottom:60px;
  left:40px;
}

.hero-text h1{font-size:40px}
.hero-text p{opacity:.7}

/* DESPRE */
#despre{
  padding:80px 20px;
  max-width:800px;
  margin:auto;
  text-align:center;
}

/* GALERIE */
#gallery{
  padding:40px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:20px;
}

.card{
  position:relative;
  overflow:hidden;
}

.card img{
  width:100%;
  height:380px;
  object-fit:cover;
  transition:.5s;
}

.card:hover img{
  transform:scale(1.08);
}

/* WATERMARK */
.watermark{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:50%;
  opacity:0.08;
}

/* LIGHTBOX */
#lightbox{
  position:fixed;
  inset:0;
  background:#000;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
  animation:fade .3s;
}

#lightbox img{
  max-width:90%;
  max-height:90%;
  animation:zoom .4s;
}

@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes zoom{from{transform:scale(.9)}to{transform:scale(1)}}

/* FOOTER */
footer{
  padding:30px;
  text-align:center;
  color:#777;
}
</style>
</head>

<body>

<!-- NAV -->
<nav>
  <div><strong>Titus Emanuel</strong></div>
  <div>
    <a href="#despre">Despre</a>
    <a href="#gallery">Portofoliu</a>
    <a href="https://instagram.com/titusemanuell" target="_blank">Instagram</a>
  </div>
</nav>

<!-- HERO -->
<section class="hero" id="hero"></section>

<!-- DESPRE -->
<section id="despre">
  <h2>Despre mine</h2>
  <p>
    Photojournalist specializat în fotografie documentară și evenimente.
    Capturând realitatea în forma ei autentică.
  </p>
</section>

<!-- GALERIE -->
<section id="gallery"></section>

<!-- LIGHTBOX -->
<div id="lightbox">
  <img src="">
</div>

<footer>
© 2026 Titus Emanuel Ilieși
</footer>

<script>
let images=[];
let currentHero=0;

/* LOAD */
async function load(){
  const res=await fetch("https://api.github.com/repos/titusemanuel/titusemanuel.ro/contents/images");
  const data=await res.json();

  images=data.filter(f=>/\.(jpg|png|jpeg)$/i.test(f.name));

  createHero();
  createGallery();
}

/* HERO SLIDER */
function createHero(){
  const hero=document.getElementById("hero");

  images.slice(0,5).forEach((img,i)=>{
    const image=document.createElement("img");
    image.src=img.download_url;
    if(i===0) image.classList.add("active");
    hero.appendChild(image);
  });

  const logo=document.createElement("img");
  logo.src="logo.png";
  logo.className="hero-logo";
  hero.appendChild(logo);

  setInterval(()=>{
    const imgs=hero.querySelectorAll("img:not(.hero-logo)");
    imgs[currentHero].classList.remove("active");
    currentHero=(currentHero+1)%imgs.length;
    imgs[currentHero].classList.add("active");
  },4000);
}

/* GALERIE */
function createGallery(){
  const gallery=document.getElementById("gallery");

  images.forEach((img,i)=>{
    const card=document.createElement("div");
    card.className="card";

    const image=document.createElement("img");
    image.src=img.download_url;
    image.loading="lazy";

    const watermark=document.createElement("img");
    watermark.src="logo.png";
    watermark.className="watermark";

    card.append(image,watermark);
    gallery.appendChild(card);

    card.onclick=()=>openLightbox(img.download_url);
  });
}

/* LIGHTBOX */
function openLightbox(src){
  const lb=document.getElementById("lightbox");
  lb.style.display="flex";
  lb.querySelector("img").src=src;
}

document.getElementById("lightbox").onclick=()=>{
  document.getElementById("lightbox").style.display="none";
};

/* PROTECT */
document.addEventListener("contextmenu",e=>e.preventDefault());

load();
</script>

</body>
</html>
