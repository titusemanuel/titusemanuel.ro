<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Titus Emanuel Ilieși — Photojournalist</title>
<meta name="description" content="Portofoliu foto — Titus Emanuel Ilieși. Galerie de imagini cu protecție.">
<meta name="author" content="Titus Emanuel Ilieși">

<style>
* {box-sizing:border-box}

body {
  margin:0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  background:#0e0e0e;
  color:#fff;
}

/* HEADER */
header {
  padding:40px 20px;
  text-align:center;
  border-bottom:1px solid #222;
}

header h1 {
  font-size:28px;
  font-weight:600;
  margin:0;
}

header p {
  margin:10px 0 0;
  color:#aaa;
  font-size:15px;
}

.nav {
  margin-top:20px;
}

.nav a {
  color:#fff;
  text-decoration:none;
  margin:0 10px;
  font-size:14px;
  opacity:.8;
}

.nav a:hover {opacity:1}

/* GALERIE */
#gallery {
  padding:30px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:20px;
}

.card {
  position:relative;
  overflow:hidden;
  background:#111;
}

.card img {
  width:100%;
  height:360px;
  object-fit:cover;
  transition:transform .4s ease;
  user-select:none;
  -webkit-user-drag:none;
}

.card:hover img {
  transform:scale(1.04);
}

.card .caption {
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:12px;
  background:linear-gradient(to top, rgba(0,0,0,.7), transparent);
  font-size:14px;
}

/* LIGHTBOX */
#lightbox {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.95);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

#lightbox img {
  max-width:92%;
  max-height:88%;
  user-select:none;
  -webkit-user-drag:none;
}

.lb-btn {
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  font-size:40px;
  color:#fff;
  cursor:pointer;
  padding:20px;
  opacity:.7;
}

.lb-btn:hover {opacity:1}

#prev {left:10px}
#next {right:10px}

/* FOOTER */
footer {
  padding:25px;
  text-align:center;
  font-size:13px;
  color:#888;
  border-top:1px solid #222;
}
</style>
</head>

<body>

<header>
  <h1>Titus Emanuel Ilieși</h1>
  <p>Photojournalist • Documentary • Events</p>

  <div class="nav">
    <a href="https://www.instagram.com/titusemanuell" target="_blank">Instagram</a>
    <a href="https://www.facebook.com/titusemanueliliesi" target="_blank">Facebook</a>
    <a href="https://www.mediafaxfoto.ro/" target="_blank">Mediafax Foto</a>
    <a href="mailto:titusemanueliliesi28@gmail.com">Email</a>
  </div>
</header>

<main>
  <section id="gallery">
    <p>Se încarcă imaginile…</p>
  </section>
</main>

<div id="lightbox">
  <span class="lb-btn" id="prev">&#10094;</span>
  <img src="" alt="">
  <span class="lb-btn" id="next">&#10095;</span>
</div>

<footer>
  © 2026 Titus Emanuel Ilieși — Toate drepturile rezervate
</footer>

<script>
let images = [];
let index = 0;

async function loadImages() {
  const res = await fetch("https://api.github.com/repos/titusemanuel/titusemanuel.ro/contents/images");
  const files = await res.json();

  images = files.filter(f => /\.(jpg|jpeg|png)$/i.test(f.name));

  const gallery = document.getElementById("gallery");
  gallery.innerHTML = "";

  images.forEach((img, i) => {
    const card = document.createElement("div");
    card.className = "card";

    const image = document.createElement("img");
    image.src = img.download_url;
    image.alt = img.name.replace(/\.[^/.]+$/, "");

    const cap = document.createElement("div");
    cap.className = "caption";
    cap.textContent = image.alt;

    card.append(image, cap);
    gallery.appendChild(card);

    card.onclick = () => openLightbox(i);
  });
}

function openLightbox(i) {
  index = i;
  const lb = document.getElementById("lightbox");
  lb.querySelector("img").src = images[i].download_url;
  lb.style.display = "flex";
}

function closeLightbox() {
  document.getElementById("lightbox").style.display = "none";
}

function next() {
  index = (index + 1) % images.length;
  openLightbox(index);
}

function prev() {
  index = (index - 1 + images.length) % images.length;
  openLightbox(index);
}

document.getElementById("next").onclick = next;
document.getElementById("prev").onclick = prev;

document.getElementById("lightbox").onclick = e => {
  if (e.target.id === "lightbox") closeLightbox();
};

/* PROTECȚIE IMAGINI */
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("dragstart", e => {
  if (e.target.tagName === "IMG") e.preventDefault();
});

loadImages();
</script>

</body>
</html>
