<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Titus Emanuel — Portfolio</title>

<style>
body{
  margin:0;
  background:#0a0a0a;
  color:#fff;
  font-family:system-ui;
}

/* NAV */
nav{
  position:fixed;
  width:100%;
  padding:20px;
  background:rgba(0,0,0,.7);
  backdrop-filter:blur(10px);
  z-index:1000;
}

nav img{height:40px;filter:invert(1)}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
  letter-spacing:5px;
}

/* ALBUM GRID */
#albums{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:20px;
  padding:100px 30px;
}

.album{
  position:relative;
  height:400px;
  overflow:hidden;
  cursor:pointer;
}

.album img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:1s;
}

/* hover zoom */
.album:hover img{
  transform:scale(1.1);
}

/* overlay */
.album::after{
  content:attr(data-title);
  position:absolute;
  bottom:0;
  left:0;
  width:100%;
  padding:20px;
  background:linear-gradient(transparent,black);
  font-size:22px;
  letter-spacing:2px;
}

/* SINGLE GALLERY */
#gallery{
  display:none;
  padding:100px 20px;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:20px;
}

.card img{
  width:100%;
  height:300px;
  object-fit:cover;
}

/* BACK BUTTON */
#back{
  position:fixed;
  top:80px;
  left:20px;
  display:none;
  z-index:2000;
  background:#fff;
  color:#000;
  padding:10px 15px;
  cursor:pointer;
}
</style>
</head>

<body>

<nav>
  <img src="logo.png">
</nav>

<div class="hero">PORTFOLIO</div>

<div id="albums"></div>

<div id="back">← Back</div>

<div id="gallery"></div>

<script>

const albums=[
  {name:"Weddings", folder:"images/album1"},
  {name:"Street", folder:"images/album2"},
  {name:"Portraits", folder:"images/album3"}
];

/* CREATE ALBUMS */
const albumsContainer=document.getElementById("albums");

albums.forEach(album=>{
  const div=document.createElement("div");
  div.className="album";
  div.dataset.title=album.name;

  // prima imagine ca cover
  const img=document.createElement("img");
  img.src=`${album.folder}/img1.jpg`;

  div.appendChild(img);
  albumsContainer.appendChild(div);

  div.onclick=()=>openAlbum(album);
});

/* OPEN ALBUM */
function openAlbum(album){
  document.getElementById("albums").style.display="none";
  document.getElementById("gallery").style.display="grid";
  document.getElementById("back").style.display="block";

  const gallery=document.getElementById("gallery");
  gallery.innerHTML="";

  for(let i=1;i<=20;i++){
    const card=document.createElement("div");
    card.className="card";

    const img=document.createElement("img");
    img.src=`${album.folder}/img${i}.jpg`;

    card.appendChild(img);
    gallery.appendChild(card);
  }
}

/* BACK */
document.getElementById("back").onclick=()=>{
  document.getElementById("albums").style.display="grid";
  document.getElementById("gallery").style.display="none";
  document.getElementById("back").style.display="none";
};

</script>

</body>
</html>
