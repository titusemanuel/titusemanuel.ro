<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Titus Emanuel Ilieși | Photojournalist Portfolio 2026</title>

<meta name="description" content="Portofoliu foto premium 2026. Fotojurnalism cinematic.">
<meta name="robots" content="index, follow">
<meta id="keywords" name="keywords" content="foto, portofoliu">

<link rel="preconnect" href="https://api.github.com">

<style>
:root{
  --bg:#050505;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:system-ui;
  background:var(--bg);
  color:#fff;
}

/* NAV */
nav{
  position:fixed;
  width:100%;
  padding:20px 40px;
  backdrop-filter:blur(20px);
  background:rgba(0,0,0,.4);
  z-index:1000;
}

.logo{
  height:50px;
  filter:invert(1);
}

/* HERO DIN POZELE TALE */
.hero{
  height:100vh;
  position:relative;
  overflow:hidden;
}

.hero img{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0;
  transition:1.5s;
  transform:scale(1.1);
}

.hero img.active{
  opacity:1;
  transform:scale(1);
}

.hero h1{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:clamp(40px,6vw,90px);
  z-index:10;
}

/* GALLERY */
.gallery{
  padding:120px 40px;
  column-count:4;
  column-gap:20px;
}

@media(max-width:1200px){.gallery{column-count:3}}
@media(max-width:800px){.gallery{column-count:2}}
@media(max-width:500px){.gallery{column-count:1}}

.item{
  margin-bottom:20px;
  break-inside:avoid;
  border-radius:16px;
  overflow:hidden;
  position:relative;
}

.item img{
  width:100%;
  transition:.6s;
}

.item:hover img{
  transform:scale(1.08);
}

/* WATERMARK */
.item::after{
  content:"© Titus Emanuel";
  position:absolute;
  bottom:10px;
  right:15px;
  font-size:12px;
  opacity:.5;
}

/* ANIMATION */
.reveal{
  opacity:0;
  transform:translateY(50px);
  transition:1s;
}
.reveal.active{
  opacity:1;
  transform:translateY(0);
}

/* FOOTER */
footer{
  text-align:center;
  padding:40px;
  color:#777;
}

/* CLICK PROTECT */
#copyright{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#000;
  padding:10px 20px;
  border-radius:10px;
  display:none;
}
</style>
</head>

<body>

<nav>
  <img src="logo.png" class="logo">
</nav>

<section class="hero" id="hero">
  <h1>TITUS EMANUEL</h1>
</section>

<section class="gallery" id="gallery"></section>

<div id="copyright">© Drept de autor protejat</div>

<footer>© 2026 Titus Emanuel</footer>

<script>
let images=[];

/* LOAD IMAGES DIN GITHUB */
async function loadImages(){
  const url="https://api.github.com/repos/titusemanuel/titusemanuel.ro/contents/images";
  const res=await fetch(url);
  const data=await res.json();

  images = data
    .filter(f => /\.(jpg|jpeg|png)$/i.test(f.name))
    .map(f => f.download_url);

  createHero();
  createGallery();
}

/* HERO SLIDESHOW DIN POZELE TALE */
function createHero(){
  const hero=document.getElementById("hero");

  images.slice(0,6).forEach((src,i)=>{
    const img=document.createElement("img");
    img.src=src;
    if(i===0) img.classList.add("active");
    hero.appendChild(img);
  });

  let i=0;
  setInterval(()=>{
    const imgs=hero.querySelectorAll("img");
    imgs[i].classList.remove("active");
    i=(i+1)%imgs.length;
    imgs[i].classList.add("active");
  },4000);
}

/* GALLERY */
function createGallery(){
  const gallery=document.getElementById("gallery");

  images.forEach(src=>{
    const div=document.createElement("div");
    div.className="item reveal";

    const img=document.createElement("img");
    img.src=src;
    img.loading="lazy";
    img.draggable=false;

    div.appendChild(img);
    gallery.appendChild(div);
  });
}

/* KEYWORDS */
async function loadKeywords(){
  try{
    const res = await fetch("https://raw.githubusercontent.com/titusemanuel/titusemanuel.ro/main/keywords.txt");
    const text = await res.text();
    document.getElementById("keywords").content = text.replace(/\n/g,",");
  }catch(e){}
}

/* SCROLL ANIMATION */
window.addEventListener("scroll",()=>{
  document.querySelectorAll(".reveal").forEach(el=>{
    if(el.getBoundingClientRect().top < window.innerHeight-100){
      el.classList.add("active");
    }
  });
});

/* PROTECT CLICK */
document.addEventListener("contextmenu",e=>{
  e.preventDefault();
  const box=document.getElementById("copyright");
  box.style.display="block";
  setTimeout(()=>box.style.display="none",2000);
});

/* DISABLE DRAG */
document.addEventListener("dragstart",e=>e.preventDefault());

/* AUTO REFRESH */
setInterval(()=>{
  location.reload();
},300000);

/* START */
loadImages();
loadKeywords();
</script>

</body>
</html>
