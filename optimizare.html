<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Optimizare Imagini</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Exemplu Optimizare Imagini pentru Mobil</h1>

  <picture>
    <source srcset="images/pic1-small.webp" type="image/webp" media="(max-width: 600px)">
    <source srcset="images/pic1-small.jpg" media="(max-width: 600px)">
    <source srcset="images/pic1-large.webp" type="image/webp">
    <img src="images/pic1-large.jpg" alt="Imagine optimizată" loading="lazy" width="600" height="400">
  </picture>

</body>
</html>
